name: Trusted PR auto-merge

on:
  pull_request_target:
    branches:
      - dev
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    if: contains(fromJSON('["CarlosCommits", "dependabot[bot]", "github-actions[bot]"]'), github.event.pull_request.user.login)
    steps:
      - name: Enable native auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
