name: Notify Stackray scanner update

on:
  push:
    branches:
      - dev

permissions: {}

jobs:
  notify-stackray:
    if: github.repository == 'CarlosCommits/httpx'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Stackray scanner pin update
        env:
          STACKRAY_DISPATCH_TOKEN: ${{ secrets.STACKRAY_DISPATCH_TOKEN }}
          HTTPX_SHA: ${{ github.sha }}
          HTTPX_REF: ${{ github.ref_name }}
        run: |
          if [ -z "$STACKRAY_DISPATCH_TOKEN" ]; then
            echo "::notice title=Stackray dispatch skipped::Set STACKRAY_DISPATCH_TOKEN to trigger Stackray scanner pin updates."
            exit 0
          fi

          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${STACKRAY_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/CarlosCommits/stackray/dispatches \
            -d "{\"event_type\":\"httpx-dev-updated\",\"client_payload\":{\"httpx_sha\":\"${HTTPX_SHA}\",\"httpx_ref\":\"${HTTPX_REF}\"}}"
