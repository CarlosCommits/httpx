name: Required PR Checks

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build httpx
        run: go build .
        working-directory: cmd/httpx

      - name: Stackray contract tests
        run: go test ./runner -run TestStackrayContract -count=1

      - name: Test
        run: go test ./...
